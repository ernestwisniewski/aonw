name: Windows Steam Build
run-name: >-
  Windows Steam Build ${{ inputs.build_name }}+${{ inputs.build_number }}
  [${{ inputs.dispatch_token }}]

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional Flutter build name override, for example 0.1.0
        required: false
        type: string
      build_number:
        description: Optional Flutter build number override, for example 57
        required: false
        type: string
      source_sha:
        description: Commit SHA expected by the release dispatcher
        required: false
        type: string
      dispatch_token:
        description: Unique token used to identify this workflow run
        required: false
        type: string

permissions:
  contents: read

env:
  AONW_RELEASE_API_BASE_URL: https://api.aonw.net

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify requested source identity
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          fi

          if [[ -n "$BUILD_NAME" || -n "$BUILD_NUMBER" ]]; then
            test -n "$BUILD_NAME"
            test -n "$BUILD_NUMBER"
            committed_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
            test "$committed_version" = "$BUILD_NAME+$BUILD_NUMBER"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Prepare Flutter
        run: |
          flutter config --enable-windows-desktop
          flutter pub get --enforce-lockfile

      - name: Build Windows release
        shell: pwsh
        run: |
          Write-Host "Building Windows release with AONW_API_BASE_URL=$env:AONW_RELEASE_API_BASE_URL"

          $flutterArgs = @(
            "build",
            "windows",
            "--release",
            "--no-pub",
            "--dart-define=AONW_API_BASE_URL=$env:AONW_RELEASE_API_BASE_URL"
          )

          if ("${{ inputs.build_name }}" -ne "") {
            $flutterArgs += "--build-name=${{ inputs.build_name }}"
          }

          if ("${{ inputs.build_number }}" -ne "") {
            $flutterArgs += "--build-number=${{ inputs.build_number }}"
          }

          flutter @flutterArgs

      - name: Package Steam artifact
        shell: pwsh
        run: |
          $releasePath = "build/windows/x64/runner/Release"
          $artifactRoot = "dist/steam-windows"
          $zipPath = "dist/aonw-windows-steam.zip"

          Remove-Item -Recurse -Force "dist" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $artifactRoot | Out-Null
          Copy-Item -Recurse -Force "$releasePath/*" $artifactRoot
          Compress-Archive -Path "$artifactRoot/*" -DestinationPath $zipPath -Force

      - name: Upload Windows Steam artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aonw-windows-steam-${{ github.run_number }}
          path: dist/aonw-windows-steam.zip
          retention-days: 30
