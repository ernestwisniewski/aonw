name: Successor Engine Deep Checks

on:
  push:
    branches:
      - dev
    paths:
      - engine/quality/engine_completion_request.md
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-engine-deep:
    name: successor engine deep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component llvm-tools-preview --component rustfmt

      - name: Install pinned dependency policy tool
        run: cargo +1.97.1 install --locked --force --version 0.20.2 cargo-deny

      - name: Install pinned release metadata tools
        run: |
          cargo +1.97.1 install --locked --force --version 0.5.9 cargo-cyclonedx
          cargo +1.97.1 install --locked --force --version 0.9.2 --features cli cargo-about

      - name: Run release-mode successor engine checks
        run: make --no-print-directory successor-engine-deep-check

      - name: Upload Rust release metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-release-metadata-${{ github.sha }}
          path: /tmp/aonw-rust-release-metadata
          if-no-files-found: warn
          retention-days: 30

  successor-engine-functional-completion:
    name: successor engine functional completion
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview

      - name: Run integrated turn, AI strength and persistence gates
        run: make --no-print-directory rust-integrated-turn-check rust-ai-strength-check rust-persistence-check
