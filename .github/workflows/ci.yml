name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality-gate:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref_name == 'dev' && 'origin/main' || github.event.before }}
      COVERAGE_RATCHET_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      ARCHITECTURE_RATCHET_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: root
            analyze: make --no-print-directory flutter-analyze
            test: make --no-print-directory flutter-coverage
            format: make --no-print-directory format-check
          - package: core
            analyze: make --no-print-directory core-analyze
            test: make --no-print-directory core-coverage
            format: ""
          - package: server_client
            analyze: make --no-print-directory client-analyze
            test: make --no-print-directory client-test
            format: ""
          - package: server
            analyze: make --no-print-directory server-analyze
            test: make --no-print-directory server-coverage
            format: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.package }}-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.package }}-
            ${{ runner.os }}-pub-

      - name: Check formatting
        if: matrix.format != ''
        run: ${{ matrix.format }}

      - name: Analyze
        run: ${{ matrix.analyze }}

      - name: Check architecture budgets
        if: matrix.package == 'root'
        run: make --no-print-directory architecture-check

      - name: Check deterministic performance baseline
        if: matrix.package == 'root'
        run: make --no-print-directory performance-check

      - name: Upload performance diagnostics
        if: matrix.package == 'root' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-report-${{ github.sha }}
          path: /tmp/aonw-performance-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Test
        run: ${{ matrix.test }}

  mutation-gate:
    name: mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTATION_RATCHET_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-mutation-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutation-
            ${{ runner.os }}-pub-

      - name: Check critical mutation gates
        run: make --no-print-directory mutation-check

  compose-config:
    name: deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Docker Compose configuration
        run: make compose-check

      - name: Validate Caddy, Prometheus, Dockerfile, and build context
        run: make infra-config-check

  generated-code-drift:
    name: generated code and migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-generated-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-generated-
            ${{ runner.os }}-pub-

      - name: Bootstrap pinned workspace
        run: make bootstrap

      - name: Check all generated code and migration drift
        run: make generated-code-check

  server-integration:
    name: server integration and critical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: aonw_test
          POSTGRES_USER: aonw
          POSTGRES_PASSWORD: aonw_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aonw -d aonw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Get server dependencies
        working-directory: server
        run: dart pub get --enforce-lockfile

      - name: Run every Serverpod PostgreSQL integration smoke
        env:
          SERVERPOD_TEST_DATABASE_PASSWORD: aonw_dev
        run: make server-integration-test

      - name: Run public auth-match-command-reconnect E2E
        env:
          SERVERPOD_TEST_DATABASE_PASSWORD: aonw_dev
        run: make serverpod-critical-e2e-test
