name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: root
            working-directory: .
            get: flutter pub get
            analyze: flutter analyze --no-pub
            test: flutter test --no-pub
            format: dart format --set-exit-if-changed .
          - package: core
            working-directory: packages/aonw_core
            get: dart pub get
            analyze: dart analyze --fatal-infos
            test: dart test
            format: ""
          - package: server_client
            working-directory: packages/aonw_server_client
            get: dart pub get
            analyze: dart analyze --fatal-infos
            test: dart test
            format: ""
          - package: server
            working-directory: server
            get: dart pub get
            analyze: dart analyze --fatal-infos
            test: dart test
            format: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.package }}-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.package }}-
            ${{ runner.os }}-pub-

      - name: Get dependencies
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.get }}

      - name: Check formatting
        if: matrix.format != ''
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.format }}

      - name: Analyze
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.analyze }}

      - name: Test
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.test }}

  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Docker Compose configuration
        run: make compose-check

  serverpod-drift:
    name: serverpod generated and migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Get server dependencies
        working-directory: server
        run: dart pub get

      - name: Install pinned Serverpod CLI
        run: dart pub global activate serverpod_cli 3.4.10

      - name: Check generated code and migration drift
        run: make check-migrations

  server-integration:
    name: server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: aonw_test
          POSTGRES_USER: aonw
          POSTGRES_PASSWORD: aonw_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aonw -d aonw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Get server dependencies
        working-directory: server
        run: dart pub get

      - name: Run every Serverpod PostgreSQL integration smoke
        env:
          SERVERPOD_TEST_DATABASE_PASSWORD: aonw_dev
        run: make server-integration-test
