name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  quality-gate:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: root
            working-directory: .
            analyze: make --no-print-directory flutter-analyze
            test: flutter test --no-pub
            format: make format-check
          - package: core
            working-directory: packages/aonw_core
            analyze: make --no-print-directory core-analyze
            test: dart test
            format: ""
          - package: server_client
            working-directory: packages/aonw_server_client
            analyze: make --no-print-directory client-analyze
            test: dart test
            format: ""
          - package: server
            working-directory: server
            analyze: make --no-print-directory server-analyze
            test: dart test
            format: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.package }}-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.package }}-
            ${{ runner.os }}-pub-

      - name: Check formatting
        if: matrix.format != ''
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.format }}

      - name: Analyze
        run: ${{ matrix.analyze }}

      - name: Test
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.test }}

  compose-config:
    name: deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Docker Compose configuration
        run: make compose-check

      - name: Validate Caddy, Prometheus, Dockerfile, and build context
        run: make infra-config-check

  generated-code-drift:
    name: generated code and migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-generated-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-generated-
            ${{ runner.os }}-pub-

      - name: Bootstrap pinned workspace
        run: make bootstrap

      - name: Check all generated code and migration drift
        run: make generated-code-check

  server-integration:
    name: server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: aonw_test
          POSTGRES_USER: aonw
          POSTGRES_PASSWORD: aonw_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aonw -d aonw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Get server dependencies
        working-directory: server
        run: dart pub get --enforce-lockfile

      - name: Run every Serverpod PostgreSQL integration smoke
        env:
          SERVERPOD_TEST_DATABASE_PASSWORD: aonw_dev
        run: make server-integration-test
