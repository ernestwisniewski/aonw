name: CI

on:
  pull_request:
  merge_group:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  client-boundaries:
    name: client boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Check client dependencies and architecture boundaries
        run: make --no-print-directory p0-check

  rust-engine:
    name: Rust engine
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component llvm-tools-preview --component rustfmt

      - name: Install pinned dependency policy tool
        run: cargo +1.97.1 install --locked --force --version 0.20.2 cargo-deny

      - name: Run fast Rust engine gate
        run: make --no-print-directory rust-engine-check

      - name: Upload Rust dependency policy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-dependency-policy-${{ github.sha }}
          path: /tmp/aonw-rust-dependencies.json
          if-no-files-found: ignore
          retention-days: 14

  rust-engine-evidence:
    name: Rust engine evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component llvm-tools-preview --component rustfmt

      - name: Install pinned coverage tool
        run: cargo +1.97.1 install --locked --force --version 0.9.0 cargo-llvm-cov

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-rust-engine-evidence-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-engine-evidence-
            ${{ runner.os }}-pub-

      - name: Generate Rust engine evidence
        run: make --no-print-directory rust-engine-evidence-check

      - name: Upload Rust engine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-engine-evidence-${{ github.sha }}
          path: |
            /tmp/aonw-rust-coverage.json
            /tmp/aonw-rust-coverage.lcov
            /tmp/aonw-rust-performance.json
          if-no-files-found: warn
          retention-days: 14

  rust-native-contract:
    name: Rust native contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Reject unsupported Rust Native Assets substitutions
        run: make --no-print-directory rust-native-assets-contract-test

  flutter-client:
    name: Flutter client
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-client-${{ hashFiles('clients/aonw_flutter/pubspec.lock', 'packages/aonw_rust_client/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-client-
            ${{ runner.os }}-pub-

      - name: Check standalone Rust-backed client
        run: make --no-print-directory flutter-client-check

      - name: Check Rust-Flutter bridge
        run: make --no-print-directory rust-flutter-test

  flutter-client-device-smoke:
    name: Flutter client device smoke
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
      FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Run standalone client device smoke
        run: make --no-print-directory flutter-client-device-test

  server:
    name: Server host and client
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-server-${{ hashFiles('packages/aonw_server_client/pubspec.lock', 'packages/aonw_server_native/pubspec.lock', 'server/pubspec.lock', 'engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-server-
            ${{ runner.os }}-pub-

      - name: Analyze and test the generated server client
        run: make --no-print-directory server-client-test

      - name: Analyze and test the Serverpod host
        run: make --no-print-directory server-test

      - name: Test the Serverpod native boundary
        run: make --no-print-directory server-native-test

  compose-config:
    name: deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: make compose-check

      - name: Validate Caddy, Prometheus, Dockerfile, and build context
        run: make infra-config-check

  generated-code:
    name: generated code
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-generated-${{ hashFiles('clients/aonw_flutter/pubspec.lock', 'packages/aonw_rust_client/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'packages/aonw_server_native/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-generated-
            ${{ runner.os }}-pub-

      - name: Cache pinned Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('.godot-version', 'tool/godot_checksums.txt') }}

      - name: Cache pinned Terrain3D
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/aonw_godot/addons/terrain_3d
          key: ${{ runner.os }}-terrain3d-${{ hashFiles('.terrain3d-version', 'tool/terrain3d_checksums.txt') }}

      - name: Bootstrap current workspaces
        run: make bootstrap

      - name: Check generated client and server code
        run: make generated-code-check

      - name: Check Flutter map geometry and bundle reproducibility
        run: make --no-print-directory flutter-client-map-contract-test

  godot-terrain:
    name: Godot Terrain3D
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Cache pinned Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('.godot-version', 'tool/godot_checksums.txt') }}

      - name: Cache pinned Terrain3D
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/aonw_godot/addons/terrain_3d
          key: ${{ runner.os }}-terrain3d-${{ hashFiles('.terrain3d-version', 'tool/terrain3d_checksums.txt') }}

      - name: Bootstrap pinned Godot and Terrain3D
        run: |
          tool/bootstrap_godot.sh
          tool/bootstrap_terrain3d.sh

      - name: Run Godot Terrain3D gate
        run: make --no-print-directory godot-check

  cross-client-map:
    name: cross-client map agreement
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pinned Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('.godot-version', 'tool/godot_checksums.txt') }}

      - name: Cache pinned Terrain3D
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/aonw_godot/addons/terrain_3d
          key: ${{ runner.os }}-terrain3d-${{ hashFiles('.terrain3d-version', 'tool/terrain3d_checksums.txt') }}

      - name: Bootstrap pinned Godot and Terrain3D
        run: |
          tool/bootstrap_godot.sh
          tool/bootstrap_terrain3d.sh

      - name: Compare Flutter and Godot map projections
        run: make --no-print-directory map-stage-1-check

  server-integration:
    name: server integration and critical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: aonw_test
          POSTGRES_USER: aonw
          POSTGRES_PASSWORD: aonw_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aonw -d aonw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Linux CI tools
        uses: ./.github/actions/setup-linux-ci

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Get server dependencies
        working-directory: server
        run: dart pub get --enforce-lockfile

      - name: Run every Serverpod PostgreSQL integration smoke
        env:
          AONW_TEST_DATABASE_PASSWORD: aonw_dev
        run: make server-integration-test

      - name: Run public auth-match-command-reconnect E2E
        env:
          AONW_TEST_DATABASE_PASSWORD: aonw_dev
        run: make serverpod-critical-e2e-test
