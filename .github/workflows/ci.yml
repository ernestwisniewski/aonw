name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  successor-boundaries:
    name: successor boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check legacy freeze and successor dependencies
        run: make --no-print-directory p0-check

  successor-flutter:
    name: successor Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-successor-flutter-${{ hashFiles('pubspec.lock', 'clients/aonw_flutter/pubspec.lock', 'packages/aonw_rust_client/pubspec.lock', 'engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-successor-flutter-
            ${{ runner.os }}-pub-

      - name: Check standalone Rust-backed client
        run: make --no-print-directory successor-flutter-check

      - name: Check successor architecture budgets
        run: make --no-print-directory architecture-check

  quality-gate:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVERAGE_BASE_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.ref_name == 'dev' && 'origin/main' || github.event.before }}
      COVERAGE_RATCHET_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      ARCHITECTURE_RATCHET_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: root
            analyze: make --no-print-directory flutter-analyze
            test: make --no-print-directory flutter-coverage
            format: make --no-print-directory format-check
          - package: core
            analyze: make --no-print-directory core-analyze
            test: make --no-print-directory core-coverage
            format: ""
          - package: server_client
            analyze: make --no-print-directory client-analyze
            test: make --no-print-directory client-test
            format: ""
          - package: server
            analyze: make --no-print-directory server-analyze
            test: make --no-print-directory server-coverage
            format: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch CI ratchet commits
        run: |
          for ref in "$COVERAGE_BASE_REF" "$COVERAGE_RATCHET_REF" "$ARCHITECTURE_RATCHET_REF"; do
            if git cat-file -e "${ref}^{commit}" 2>/dev/null; then
              continue
            fi
            case "$ref" in
              origin/*)
                branch="${ref#origin/}"
                git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
                ;;
              *)
                git fetch --no-tags origin "$ref"
                ;;
            esac
            git cat-file -e "${ref}^{commit}"
          done

      - name: Normalize synchronized dev ratchets
        if: github.event_name == 'push' && github.ref_name == 'dev'
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "COVERAGE_RATCHET_REF=origin/main" >> "$GITHUB_ENV"
            echo "ARCHITECTURE_RATCHET_REF=origin/main" >> "$GITHUB_ENV"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ matrix.package }}-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.package }}-
            ${{ runner.os }}-pub-

      - name: Check formatting
        if: matrix.format != ''
        run: ${{ matrix.format }}

      - name: Analyze
        run: ${{ matrix.analyze }}

      - name: Check architecture budgets
        if: matrix.package == 'root'
        run: make --no-print-directory architecture-check

      - name: Check deterministic performance baseline
        if: matrix.package == 'root'
        run: make --no-print-directory performance-check

      - name: Upload performance diagnostics
        if: matrix.package == 'root' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-report-${{ github.sha }}
          path: /tmp/aonw-performance-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Test
        run: ${{ matrix.test }}

      - name: Build coverage baseline diagnostic
        if: always() && matrix.package != 'server_client'
        continue-on-error: true
        run: |
          report="coverage/${{ matrix.package }}.lcov.info"
          if [ -f "$report" ]; then
            dart run tool/check_coverage.dart snapshot \
              --scope "${{ matrix.package }}" \
              > "/tmp/aonw-coverage-${{ matrix.package }}.json"
          fi

      - name: Upload coverage diagnostics
        if: always() && matrix.package != 'server_client'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.package }}-${{ github.sha }}
          path: |
            /tmp/aonw-coverage-${{ matrix.package }}.json
            coverage/${{ matrix.package }}.lcov.info
          if-no-files-found: ignore
          retention-days: 14

  native-single-player-smoke:
    name: native single-player smoke
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
      FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Run native End turn save reload smoke
        run: make --no-print-directory native-local-game-smoke

  successor-flutter-device-smoke:
    name: successor Flutter device smoke
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
      FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Run standalone client device smoke
        run: make --no-print-directory successor-flutter-device-test

  mutation-gate:
    name: mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTATION_RATCHET_REF: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch mutation ratchet commit
        run: |
          if ! git cat-file -e "${MUTATION_RATCHET_REF}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$MUTATION_RATCHET_REF"
          fi
          git cat-file -e "${MUTATION_RATCHET_REF}^{commit}"

      - name: Normalize synchronized dev mutation ratchet
        if: github.event_name == 'push' && github.ref_name == 'dev'
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "MUTATION_RATCHET_REF=origin/main" >> "$GITHUB_ENV"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-mutation-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutation-
            ${{ runner.os }}-pub-

      - name: Check critical mutation gates
        run: make --no-print-directory mutation-check

  compose-config:
    name: deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: make compose-check

      - name: Validate Caddy, Prometheus, Dockerfile, and build context
        run: make infra-config-check

  generated-code-drift:
    name: generated code and migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-generated-${{ hashFiles('pubspec.lock', 'packages/aonw_core/pubspec.lock', 'packages/aonw_server_client/pubspec.lock', 'server/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-generated-
            ${{ runner.os }}-pub-

      - name: Cache pinned Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('.godot-version', 'tool/godot_checksums.txt') }}

      - name: Cache pinned Terrain3D
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/aonw_godot/addons/terrain_3d
          key: ${{ runner.os }}-terrain3d-${{ hashFiles('.terrain3d-version', 'tool/terrain3d_checksums.txt') }}

      - name: Bootstrap pinned workspace
        run: make bootstrap

      - name: Check all generated code and migration drift
        run: make generated-code-check

      - name: Check successor map geometry and bundle reproducibility
        run: make --no-print-directory successor-map-contract-test

  godot-terrain:
    name: Godot Terrain3D
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pinned Godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('.godot-version', 'tool/godot_checksums.txt') }}

      - name: Cache pinned Terrain3D
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: clients/aonw_godot/addons/terrain_3d
          key: ${{ runner.os }}-terrain3d-${{ hashFiles('.terrain3d-version', 'tool/terrain3d_checksums.txt') }}

      - name: Bootstrap pinned Godot and Terrain3D
        run: |
          tool/bootstrap_godot.sh
          tool/bootstrap_terrain3d.sh

      - name: Run Godot Terrain3D gate
        run: make --no-print-directory godot-check

  server-integration:
    name: server integration and critical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: aonw_test
          POSTGRES_USER: aonw
          POSTGRES_PASSWORD: aonw_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aonw -d aonw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Get server dependencies
        working-directory: server
        run: dart pub get --enforce-lockfile

      - name: Run every Serverpod PostgreSQL integration smoke
        env:
          SERVERPOD_TEST_DATABASE_PASSWORD: aonw_dev
        run: make server-integration-test

      - name: Run public auth-match-command-reconnect E2E
        env:
          SERVERPOD_TEST_DATABASE_PASSWORD: aonw_dev
        run: make serverpod-critical-e2e-test
