name: Godot Terrain3D

on:
  pull_request:
    paths:
      - '.github/workflows/godot-terrain3d.yml'
      - 'clients/aonw2_godot/**'
      - 'engine/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-terrain3d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  godot-terrain3d:
    name: Godot 4.7.1 + Terrain3D 1.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_ARCHIVE: Godot_v4.7.1-stable_linux.x86_64.zip
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      TERRAIN3D_ARCHIVE: Terrain3D_v1.0.2-stable.zip
      TERRAIN3D_SHA256: a071850250ec5e596aa54da61c01d75768774eb379ee997584d426a45f4884a2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-godot-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-godot-cargo-

      - name: Download pinned Godot and Terrain3D releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/downloads .tools/godot

          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --fail --location --show-error \
            --output ".tools/downloads/$GODOT_ARCHIVE" \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/$GODOT_ARCHIVE"
          echo "$GODOT_SHA256  .tools/downloads/$GODOT_ARCHIVE" | sha256sum -c -
          unzip -q ".tools/downloads/$GODOT_ARCHIVE" -d .tools/godot
          chmod +x ".tools/godot/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/.tools/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --fail --location --show-error \
            --output ".tools/downloads/$TERRAIN3D_ARCHIVE" \
            "https://github.com/TokisanGames/Terrain3D/releases/download/v1.0.2-stable/$TERRAIN3D_ARCHIVE"
          echo "$TERRAIN3D_SHA256  .tools/downloads/$TERRAIN3D_ARCHIVE" | sha256sum -c -

      - name: Test and install pinned Terrain3D addon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s clients/aonw2_godot/tools \
            -p 'test_*.py' \
            -v
          python3 clients/aonw2_godot/tools/install_terrain3d.py \
            --archive ".tools/downloads/$TERRAIN3D_ARCHIVE"

      - name: Run Godot map and editor checks
        shell: bash
        run: make --no-print-directory godot-test GODOT_BIN="$GODOT_BIN"

      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-terrain3d-${{ github.sha }}
          path: |
            /tmp/aonw-godot-check-only.log
            /tmp/aonw-godot-test.log
            /tmp/aonw-godot-runtime.log
            /tmp/aonw-godot-editor.log
          if-no-files-found: ignore
          retention-days: 14
