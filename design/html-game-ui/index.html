<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Age of New Worlds · HTML UI Design Sandbox</title>
    <link rel="stylesheet" href="./design-tokens.css" />
    <link rel="stylesheet" href="./styles/host.css" />
    <link rel="stylesheet" href="./styles/primitives.css" />
    <link rel="stylesheet" href="./styles/menu.css" />
    <link rel="stylesheet" href="./styles/routes.css" />
    <link rel="stylesheet" href="./styles/map.css" />
    <link rel="stylesheet" href="./styles/system.css" />
    <link rel="stylesheet" href="./styles/modals.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
  </head>
  <body>
    <div class="designer-shell" id="designer-shell">
      <aside class="designer-nav" aria-label="Design sandbox navigation">
        <div class="designer-nav__brand">
          <span class="designer-nav__eyebrow">AONW</span>
          <strong>HTML UI package</strong>
          <small>Flutter presentation mirror</small>
        </div>
        <label class="designer-search">
          <svg class="ui-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
          <input id="view-search" type="search" placeholder="Filter views…" autocomplete="off" />
        </label>
        <div class="designer-nav__scroll" id="view-navigation"></div>
        <div class="designer-nav__footer">
          <span id="coverage-count">0 views</span>
          <a href="./view-manifest.json" target="_blank" rel="noreferrer">manifest</a>
        </div>
      </aside>

      <main class="designer-workspace">
        <header class="designer-toolbar">
          <div class="designer-toolbar__group">
            <label>
              <span>Viewport</span>
              <select id="viewport-select">
                <option value="desktop">Desktop · 1440×900</option>
                <option value="desktop-small">Desktop · 1280×720</option>
                <option value="tablet">Tablet · 1024×768</option>
                <option value="mobile">Mobile · 390×844</option>
                <option value="mobile-landscape">Mobile landscape · 844×390</option>
              </select>
            </label>
            <span class="designer-toolbar__size" id="viewport-size"></span>
          </div>
          <div class="designer-toolbar__title">
            <span id="active-view-kind">Screen</span>
            <strong id="active-view-title">Main menu</strong>
          </div>
          <div class="designer-toolbar__actions">
            <button class="designer-button" id="copy-link" type="button">
              <svg class="ui-icon" aria-hidden="true"><use href="#icon-link"></use></svg>
              Copy link
            </button>
            <button class="designer-button" id="toggle-clean" type="button">
              <svg class="ui-icon" aria-hidden="true"><use href="#icon-expand"></use></svg>
              Clean preview
            </button>
          </div>
        </header>

        <section class="viewport-stage" id="viewport-stage" aria-label="Game viewport preview">
          <div class="viewport-measure" id="viewport-measure">
            <div class="game-viewport" id="game-viewport">
              <div id="game-root" class="game-root"></div>
              <div id="modal-root" class="modal-root" aria-live="polite"></div>
              <div id="toast-root" class="toast-root" aria-live="polite"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <svg class="icon-sprite" aria-hidden="true" focusable="false">
