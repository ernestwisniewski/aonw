name: aonw
description: "4X strategic hex game"
publish_to: 'none'

version: 1.1.17+89

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.38.0
  flame_texturepacker: 5.1.2

  share_plus: ^13.3.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sembast: ^3.7.0
  sembast_web: ^2.4.0
  archive: ^4.0.9
  aonw_core:
    path: packages/aonw_core
  aonw_rust_client:
    path: packages/aonw_rust_client
  aonw_server_client:
    path: packages/aonw_server_client
  serverpod_auth_core_client: 3.4.11
  serverpod_auth_idp_flutter: 3.4.11
  freezed_annotation: ^3.1.0
  intl: 0.20.3
  json_annotation: ^4.11.0
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^10.3.1
  image: ^4.9.1
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  gamepads: ^0.1.10+4
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flame_test: ^2.3.0

  analyzer: 12.1.0
  crypto: 3.0.7
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  file_selector_platform_interface: ^2.7.0
  riverpod_generator: ^4.0.3
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  yaml: ^3.1.3

dependency_overrides:
  # The pinned Serverpod Auth IDP release still constrains sign_in_with_apple to 7.x.
  # This local patch keeps the 7.x Dart API and adds current SDK Swift cases.
  sign_in_with_apple:
    path: third_party/sign_in_with_apple
  # Desktop authentication uses the system browser plus server-side polling.
  # Keep flutter_web_auth_2's unused embedded-webview dependency out of native
  # bundles so Linux does not link against WebKitGTK at process startup.
  desktop_webview_window:
    path: tool/linux/desktop_webview_window_stub
  # The upstream Linux implementation terminates the process when /dev/input
  # is unavailable and has unsafe hotplug ownership. Keep the patch local and
  # reproducible until those fixes are available in a published release.
  gamepads_linux:
    path: third_party/gamepads_linux

flutter:
  generate: true
  uses-material-design: true

  assets:
    - test/fixtures/legacy_map.json
    - content/maps/dravonia/map.json
    - content/maps/myranth/map.json
    - content/maps/terenos/map.json
    - content/maps/verdantia/map.json
    - assets/runtime/maps/dravonia/
    - assets/runtime/maps/myranth/
    - assets/runtime/maps/terenos/
    - assets/runtime/maps/verdantia/
    - assets/runtime/sprites/
    - assets/runtime/sprites/buildings_a/
    - assets/runtime/sprites/buildings_b/
    - assets/runtime/sprites/buildings_c/
    - assets/runtime/sprites/cities/
    - assets/runtime/sprites/dice/
    - assets/runtime/sprites/icons_map/
    - assets/runtime/sprites/improvements_1/
    - assets/runtime/sprites/improvements_2/
    - assets/runtime/sprites/improvements_3/
    - assets/runtime/sprites/improvements_4/
