[package]
name = "aonw_godot"
description = "Godot GDExtension adapter for the AoNW Rust engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aonw_contracts = { path = "../aonw_contracts" }
aonw_local_runtime = { path = "../aonw_local_runtime" }
aonw_map_workbench = { path = "../aonw_map_workbench" }
godot.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
