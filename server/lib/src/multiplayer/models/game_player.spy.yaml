class: GamePlayer
table: aonw_player
fields:
  match: GameMatch?, relation(name=match_players, onDelete=Cascade)
  publicPlayerId: String
  userIdentifier: String
  displayName: String
  colorValue: int
  countryId: String
  kind: String
  connectionState: String
  ready: bool
  seatOrder: int
indexes:
  # Keeps the existing unique (match, user) invariant while putting the lookup
  # key first for participant discovery.
  aonw_player_user_match_idx:
    fields: userIdentifier, matchId
    unique: true
  aonw_player_match_public_idx:
    fields: matchId, publicPlayerId
    unique: true
