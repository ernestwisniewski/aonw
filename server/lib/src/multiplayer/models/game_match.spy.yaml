class: GameMatch
table: aonw_match
fields:
  publicId: String
  ownerUserIdentifier: String
  name: String
  mapName: String
  state: String
  turn: int
  maxPlayers: int
  minPlayers: int
  private: bool
  quickplay: bool
  createdAt: DateTime
  startedAt: DateTime?
  endedAt: DateTime?
  outcomeCondition: String?
  winnerPlayerId: String?
  autoStartAt: DateTime?
  inviteCode: String?
  players: List<GamePlayer>?, relation(name=match_players)
  snapshots: List<GameSnapshot>?, relation(name=match_snapshots)
  events: List<GameEvent>?, relation(name=match_events)
indexes:
  aonw_match_public_id_idx:
    fields: publicId
    unique: true
  aonw_match_invite_code_idx:
    fields: inviteCode
    unique: true
  aonw_match_state_created_public_idx:
    fields: state, createdAt, publicId
  aonw_match_public_discovery_idx:
    fields: state, private, inviteCode, createdAt, publicId
  aonw_match_quickplay_candidate_idx:
    fields: state, private, quickplay, inviteCode, mapName, createdAt, publicId
  aonw_match_started_at_idx:
    fields: startedAt
  aonw_match_ended_at_idx:
    fields: endedAt
